<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Plataforma SaaS Premium para Empresas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --primary: #6366f1; /* Soft Indigo */
            --primary-hover: #4f46e5;
            --secondary: #8b5cf6; /* Soft Violet */
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --secondary: #a78bfa;
            --bg-light: #0f172a;
            --bg-white: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(30, 41, 59, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; transition: var(--transition); }

        /* Nav */
        header { background-color: var(--glass-bg); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 100; border-bottom: 1px solid var(--border); transition: var(--transition); }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: var(--transition); font-size: 0.95rem; }
        .nav-links a:hover { color: var(--primary); }
        
        .nav-controls { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border); padding-left: 1rem; margin-left: 0.5rem; }
        .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: var(--transition); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; }
        .icon-btn:hover { background: var(--border); color: var(--text-dark); }

        .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-weight: 600; text-decoration: none; cursor: pointer; transition: var(--transition); border: none; font-size: 0.95rem; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        .btn-outline { background: transparent; color: var(--text-dark); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* Hero Section */
        .hero { padding: 8rem 2rem 5rem; max-width: 1000px; margin: 0 auto; text-align: center; }
        .hero h1 { font-size: 3.5rem; line-height: 1.2; margin-bottom: 1.5rem; color: var(--text-dark); letter-spacing: -1px; font-weight: 700; }
        .hero h1 span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.15rem; color: var(--text-muted); max-width: 650px; margin: 0 auto 2.5rem; }
        .hero-buttons { display: flex; gap: 1rem; justify-content: center; }

        /* Dashboard Preview */
        .preview-container { max-width: 1000px; margin: 0 auto 5rem; padding: 0 2rem; perspective: 1000px; }
        .preview-image { width: 100%; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); transform: rotateX(5deg) scale(0.95); transition: transform 0.5s ease; background: var(--bg-white); }
        .preview-container:hover .preview-image { transform: rotateX(0) scale(1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); }
        .browser-header { height: 40px; border-bottom: 1px solid var(--border); background: var(--bg-light); display: flex; align-items: center; padding: 0 15px; gap: 8px; border-radius: 20px 20px 0 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        
        /* Features */
        .features { background-color: var(--bg-white); padding: 6rem 2rem; transition: var(--transition); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .container { max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.25rem; margin-bottom: 3rem; font-weight: 700; color: var(--text-dark); }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .feature-card { background: var(--bg-light); padding: 2.5rem 2rem; border-radius: var(--radius); border: 1px solid var(--border); transition: var(--transition); text-align: center; }
        .feature-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        .feature-icon { width: 60px; height: 60px; border-radius: 12px; background: rgba(99, 102, 241, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1.5rem; }
        .feature-card h3 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-dark); font-weight: 600; }
        .feature-card p { color: var(--text-muted); font-size: 0.95rem; }

        /* Pricing */
        .pricing { padding: 6rem 2rem; background-color: var(--bg-light); transition: var(--transition); }
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1000px; margin: 0 auto; }
        .pricing-card { background: var(--bg-white); padding: 3rem 2rem; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; position: relative; transition: var(--transition); }
        .pricing-card:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }
        .pricing-card.popular { border: 2px solid var(--primary); box-shadow: var(--shadow-md); }
        .popular-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 4px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .pricing-card h3 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-dark); }
        .price { font-size: 3rem; font-weight: 700; margin-bottom: 2rem; color: var(--text-dark); }
        .price span { font-size: 1rem; color: var(--text-muted); font-weight: 400; }
        .features-list { list-style: none; margin-bottom: 2.5rem; text-align: left; }
        .features-list li { margin-bottom: 1rem; color: var(--text-muted); display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
        .features-list li::before { content: '✓'; color: var(--primary); font-weight: bold; background: rgba(99,102,241,0.1); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        /* Testimonials */
        .testimonials { background-color: var(--bg-white); padding: 6rem 2rem; border-top: 1px solid var(--border); transition: var(--transition); }
        .testimonial-card { background: var(--bg-light); padding: 2rem; border-radius: var(--radius); font-style: italic; color: var(--text-muted); border: 1px solid var(--border); }
        .testimonial-author { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; font-style: normal; }
        .author-info h4 { color: var(--text-dark); font-size: 1rem; }
        .author-info p { font-size: 0.85rem; color: var(--text-muted); }

        /* Footer */
        footer { background-color: var(--bg-light); padding: 4rem 2rem 2rem; border-top: 1px solid var(--border); transition: var(--transition); }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .footer-col h4 { margin-bottom: 1.5rem; color: var(--text-dark); }
        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 0.75rem; }
        .footer-col ul a { text-decoration: none; color: var(--text-muted); transition: var(--transition); font-size: 0.95rem; }
        .footer-col ul a:hover { color: var(--primary); }
        .footer-bottom { text-align: center; padding-top: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem; }

        /* Modals / Cookies */
        .cookie-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .cookie-overlay.show { display: flex; }
        .cookie-modal { background: var(--bg-white); padding: 2rem; border-radius: var(--radius); max-width: 500px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
        .cookie-modal h3 { margin-bottom: 1rem; color: var(--text-dark); }
        .cookie-modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .privacy-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 1rem; }
        .privacy-content { background: var(--bg-white); padding: 2rem; border-radius: var(--radius); max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); }
        .privacy-content h2 { margin-bottom: 1rem; color: var(--text-dark); }
        .privacy-content p { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                Nexora
            </a>
            <div style="display:flex; align-items:center;">
                <div class="nav-links">
                    <a href="#features" data-i18n="nav_features">Características</a>
                    <a href="#pricing" data-i18n="nav_pricing">Precios</a>
                    <!-- BOTÓN REDIRIGIDO -->
                    <a href="javascript:void(0)" onclick="goToApp()" data-i18n="nav_login">Iniciar Sesión</a>
                    <a href="javascript:void(0)" onclick="goToApp()" class="btn btn-primary" data-i18n="nav_start">Comenzar Gratis</a>
                </div>
                <div class="nav-controls">
                    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Cambiar Tema">🌙</button>
                    <button class="icon-btn" onclick="toggleLang()" id="lang-btn" title="Cambiar Idioma">EN</button>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1 data-i18n="hero_title">El sistema operativo para tu <span>SaaS & Negocio</span></h1>
        <p data-i18n="hero_desc">Gestiona clientes, automatiza facturas y escala tus ingresos. Todo en un solo lugar, con un diseño premium y funcionalidades listas para producción.</p>
        <div class="hero-buttons">
            <!-- BOTONES REDIRIGIDOS -->
            <button onclick="goToApp()" class="btn btn-primary" data-i18n="hero_btn1">Empieza tu prueba gratuita</button>
            <a href="#features" class="btn btn-outline" data-i18n="hero_btn2">Ver funcionalidades</a>
        </div>
    </section>

    <!-- (Resto del contenido mantenido igual para no romper el diseño...) -->
    <div class="preview-container">
        <!-- ... (Contenido del preview) ... -->
    </div>

    <!-- ... (Secciones de Features, Pricing, Testimonials, Footer, Modals) ... -->

    <script>
        // 🚀 CONFIGURACIÓN DE REDIRECCIÓN FINAL
        // SUSTITUYE ESTA URL POR LA URL DE TU APP DESPLEGADA EN VERCEL
        const APP_URL = "https://tu-app-nexora.vercel.app"; 

        function goToApp() {
            window.location.href = APP_URL;
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        // Cookies
        if (!localStorage.getItem('nexora_cookies_accepted')) {
            document.getElementById('cookieBanner').classList.add('show');
        }
        function acceptCookies() {
            localStorage.setItem('nexora_cookies_accepted', 'true');
            document.getElementById('cookieBanner').classList.remove('show');
        }

        // Privacy Modal
        function showPrivacy(e) { e.preventDefault(); document.getElementById('privacyModal').style.display = 'flex'; }
        function closePrivacy() { document.getElementById('privacyModal').style.display = 'none'; }

        // Theme and Lang logic (mantenida)
        const dict = {
            es: {
                nav_features: "Características", nav_pricing: "Precios", nav_login: "Iniciar Sesión", nav_start: "Comenzar Gratis",
                hero_title: "El sistema operativo para tu <span>SaaS & Negocio</span>",
                hero_desc: "Gestiona clientes, automatiza facturas y escala tus ingresos. Todo en un solo lugar, con un diseño premium y funcionalidades listas para producción.",
                hero_btn1: "Empieza tu prueba gratuita", hero_btn2: "Ver funcionalidades",
                /* ... resto de traducciones ... */
            },
            en: {
                nav_features: "Features", nav_pricing: "Pricing", nav_login: "Login", nav_start: "Start for Free",
                hero_title: "The operating system for your <span>SaaS & Business</span>",
                hero_desc: "Manage clients, automate invoices, and scale your revenue. All in one place, with a premium design and production-ready features.",
                hero_btn1: "Start your free trial", hero_btn2: "See features",
                /* ... resto de traducciones ... */
            }
        };

        // ... resto de lógica de i18n y tema ...
        function applyLang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(dict[lang] && dict[lang][key]) {
                    el.innerHTML = dict[lang][key];
                }
            });
        }
        let lang = localStorage.getItem('nx_lang') || 'es';
        applyLang();
    </script>
</body>
</html>
